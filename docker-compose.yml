version: "3.9"

# ===========================================================================
# Digital Twin Telemetry Engine - Full Pipeline Docker Compose
#
# Pipeline flow:
#   Simulator → Ingestion Server → Kafka → TSDB Writer + ML Service
#                                        → Correction Engine → API Gateway
#
# Services communicate exclusively via Kafka topics:
#   telemetry.raw        : Ingestion → TSDB Writer, ML Service, Correction Engine
#   predictions.state    : ML Service → Correction Engine
#   corrections.state    : Correction Engine → API Gateway
#   alerts.anomaly       : Correction Engine → (consumers)
#   metrics.pipeline     : All → (monitoring)
# ===========================================================================

x-common-env: &common-env
  BROKER_TYPE: kafka
  BROKER_URL: kafka:29092
  PYTHONUNBUFFERED: "1"
  LOG_FORMAT: json

x-common-build: &common-build
  build:
    context: .
    dockerfile: Dockerfile

services:
  # =========================================================================
  # Infrastructure Services
  # =========================================================================

  zookeeper:
    image: confluentinc/cp-zookeeper:7.7.1
    container_name: dt-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    ports:
      - "2181:2181"
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc localhost 2181 | grep imok"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: confluentinc/cp-kafka:7.7.1
    container_name: dt-kafka
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_NUM_PARTITIONS: 6
    healthcheck:
      test: ["CMD-SHELL", "kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 10s
      retries: 5

  influxdb:
    image: influxdb:2.7
    container_name: dt-influxdb
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: admin
      DOCKER_INFLUXDB_INIT_PASSWORD: adminpassword
      DOCKER_INFLUXDB_INIT_ORG: digital-twin
      DOCKER_INFLUXDB_INIT_BUCKET: telemetry
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: dev-token-digital-twin
    volumes:
      - influxdb-data:/var/lib/influxdb2
    healthcheck:
      test: ["CMD", "influx", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    container_name: dt-timescaledb
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: digital_twin
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.4-alpine
    container_name: dt-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # =========================================================================
  # Application Services
  # =========================================================================

  ingestion-server:
    <<: *common-build
    container_name: dt-ingestion-server
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      <<: *common-env
      WEBSOCKET_PORT: "8080"
      MAX_BUFFER_SIZE: "10000"
      BROKER_PUBLISH_TIMEOUT_MS: "5000"
    command: ["python", "-m", "digital_twin_engine.ingestion"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8080/docs')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  tsdb-writer:
    <<: *common-build
    container_name: dt-tsdb-writer
    depends_on:
      kafka:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    environment:
      <<: *common-env
      TSDB_TYPE: influxdb
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: dev-token-digital-twin
      INFLUXDB_ORG: digital-twin
      INFLUXDB_BUCKET: telemetry
      WRITE_BATCH_SIZE: "100"
      BATCH_WINDOW_SECONDS: "1.0"
      WRITE_RETRY_COUNT: "3"
    command: ["python", "-m", "digital_twin_engine.tsdb"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; sys.exit(0)\""]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  ml-service:
    <<: *common-build
    container_name: dt-ml-service
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      <<: *common-env
      MIN_BATCH_SIZE: "10"
      MAX_BATCH_SIZE: "500"
      MAX_BATCH_WAIT_SECONDS: "5.0"
      PREDICTION_HORIZON_SECONDS: "60.0"
      LSTM_WEIGHT: "0.6"
      XGBOOST_WEIGHT: "0.4"
    command: ["python", "-m", "digital_twin_engine.ml_service"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; sys.exit(0)\""]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  correction-engine:
    <<: *common-build
    container_name: dt-correction-engine
    depends_on:
      kafka:
        condition: service_healthy
      ml-service:
        condition: service_started
    environment:
      <<: *common-env
      ENSEMBLE_SIZE: "50"
      TEMPORAL_TOLERANCE_SECONDS: "1.0"
      ANOMALY_THRESHOLD_SIGMA: "3.0"
    command: ["python", "-m", "digital_twin_engine.correction"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import sys; sys.exit(0)\""]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped

  api-gateway:
    <<: *common-build
    container_name: dt-api-gateway
    depends_on:
      kafka:
        condition: service_healthy
      influxdb:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      <<: *common-env
      API_PORT: "8000"
      TSDB_TYPE: influxdb
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: dev-token-digital-twin
      INFLUXDB_ORG: digital-twin
      INFLUXDB_BUCKET: telemetry
      DEFAULT_PAGE_SIZE: "100"
      MAX_PAGE_SIZE: "1000"
    command: ["python", "-m", "digital_twin_engine.api"]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  influxdb-data:
  timescaledb-data:
