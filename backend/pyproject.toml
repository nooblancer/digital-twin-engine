[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "digital-twin-engine"
version = "0.1.0"
description = "Real-Time Digital Twin Telemetry Engine - distributed microservices pipeline for telemetry ingestion, ML prediction, and state correction"
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.115.6",
    "uvicorn[standard]==0.34.0",
    "websockets==14.1",
    "aiokafka==0.12.0",
    "redis[hiredis]==5.2.1",
    "influxdb-client[async]==1.47.0",
    "asyncpg==0.30.0",
    "numpy==2.1.3",
    "scipy==1.14.1",
    "torch==2.5.1",
    "scikit-learn==1.6.0",
    "pydantic==2.10.3",
    "structlog==24.4.0",
]

[project.optional-dependencies]
dev = [
    "pytest==8.3.4",
    "pytest-asyncio==0.24.0",
    "hypothesis==6.119.3",
    "httpx==0.28.1",
    "pytest-cov==6.0.0",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["digital_twin_engine*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = [
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
]

[tool.coverage.run]
source = ["src/digital_twin_engine"]
omit = ["*/tests/*", "*/simulator/*"]
